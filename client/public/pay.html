<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Now</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    .dairy { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .label { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .amount {
      font-size: 36px;
      font-weight: 800;
      color: #16a34a;
      margin-bottom: 8px;
    }
    .upi-id {
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #16a34a; color: white; }
    .btn-secondary { background: #f3f4f6; color: #374151; font-size: 14px; }
    .note { font-size: 12px; color: #9ca3af; margin-top: 16px; line-height: 1.5; }
    .redirecting { color: #16a34a; font-size: 14px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🥛</div>
    <div class="dairy" id="dairyName">Dairy</div>
    <div class="label">Milk Bill Payment</div>
    <div class="amount" id="amount">₹0</div>
    <div class="upi-id" id="upiId">UPI ID</div>
    <a class="btn btn-primary" id="payBtn" href="#">Pay Now →</a>
    <button class="btn btn-secondary" id="copyBtn" onclick="copyUpi()">Copy UPI ID</button>
    <div class="redirecting" id="redirecting">Opening your UPI app...</div>
    <div class="note">
      Tap "Pay Now" to open PhonePe, GPay, or Paytm.<br/>
      Amount is pre-filled. Enter your UPI PIN to pay.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pa = params.get("pa") || "";
    const pn = params.get("pn") || "Dairy";
    const am = params.get("am") || "0";
    const tn = params.get("tn") || "Milk Bill";

    // Populate UI
    document.getElementById("dairyName").textContent = pn;
    document.getElementById("amount").textContent = "₹" + parseFloat(am).toFixed(2);
    document.getElementById("upiId").textContent = pa;

    // Build UPI deep link
    const upiLink = `upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&am=${am}&cu=INR&tn=${encodeURIComponent(tn)}`;
    document.getElementById("payBtn").href = upiLink;

    // Auto-redirect on mobile after short delay
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    if (isMobile && pa && parseFloat(am) > 0) {
      document.getElementById("redirecting").style.display = "block";
      setTimeout(() => { window.location.href = upiLink; }, 800);
    }

    function copyUpi() {
      navigator.clipboard.writeText(pa).then(() => {
        document.getElementById("copyBtn").textContent = "Copied!";
        setTimeout(() => {
          document.getElementById("copyBtn").textContent = "Copy UPI ID";
        }, 2000);
      });
    }
  </script>
</body>
</html>
