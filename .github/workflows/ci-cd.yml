name: CI / CD — Siddhivinayak Dairy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── BUILD CHECK ───────────────────────────────────────────────────────────────
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Verify server app loads
        working-directory: server
        run: node -e "require('./src/app.js'); console.log('✅ Server app.js OK');"
        env:
          NODE_ENV: development
          MONGO_URI: mongodb+srv://dairyAdmin:efJ2NnHU0nftDRjd@dairy-app-cluster.aa77xs3.mongodb.net/dairy-app?retryWrites=true&w=majority
          JWT_SECRET: 029c49c9f1d5bf2e0e8925504bb55a9f
          CLIENT_URL: https://dairy-app-live.vercel.app
          PORT: 5000

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build Vite client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://dairy-app-backend-live.vercel.app

  # ── DEPLOY SERVER ─────────────────────────────────────────────────────────────
  deploy-server:
    name: Deploy Server → Vercel
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy server to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: server
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}

  # ── DEPLOY CLIENT ─────────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy Client → Vercel
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy client to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: client
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}